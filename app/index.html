<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c9c3ff">
  <title>Reels Enjoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=202611182216">
</head>
<body>
  <!-- লগইন / রেজিস্টার -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="logo-big">▶</div>
      <h1>Reels Enjoy</h1>
      <p class="muted">ভিডিও দেখুন, বানান, আয় করুন</p>
      <form id="loginForm">
        <div class="seg"><button type="button" data-m="phone" class="on">মোবাইল নম্বর</button><button type="button" data-m="email">ইমেইল</button></div>
        <div class="phone-row" id="liPhoneRow"><select class="cc" id="liCC"></select><input id="liPhone" inputmode="tel" placeholder="মোবাইল নম্বর" autocomplete="tel"></div>
        <input id="liEmail" class="hidden" type="email" placeholder="ইমেইল" autocomplete="email">
        <input id="liPass" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
        <button class="btn primary" type="submit">লগইন</button>
        <p class="switch">অ্যাকাউন্ট নেই? <a href="#" id="toReg">রেজিস্টার করুন</a></p>
      </form>
      <form id="regForm" class="hidden">
        <input id="rgName" placeholder="আপনার নাম" required>
        <input id="rgUser" placeholder="ইউজারনেম (ইংরেজি, যেমন rahim_01)" autocapitalize="off" required>
        <div class="pick2"><span>আপনি</span><label><input type="radio" name="rgG" value="male" required><b>👨 ছেলে</b></label><label><input type="radio" name="rgG" value="female"><b>👩 মেয়ে</b></label></div>
        <div class="pick2" translate="no"><span id="rgLangL">ভাষা / Language</span><label><input type="radio" name="rgL" value="bn"><b>বাংলা</b></label><label><input type="radio" name="rgL" value="en"><b>English</b></label></div>
        <div class="phone-row"><select class="cc" id="rgCC"></select><input id="rgPhone" inputmode="tel" placeholder="মোবাইল নম্বর" required></div>
        <input id="rgEmail" type="email" placeholder="ইমেইল (ঐচ্ছিক — ইমেইল দিয়েও লগইন করা যাবে)" autocomplete="email">
        <input id="rgPass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="new-password" required>
        <input id="rgRef" inputmode="numeric" placeholder="রেফার কোড — বন্ধুর ID নম্বর (ঐচ্ছিক)">
        <label class="agree"><input type="checkbox" id="rgAge" required> <span>আমার বয়স ১৮ বা তার বেশি এবং আমি <a href="../policy/terms.html" target="_blank">ব্যবহারের শর্তাবলি</a> ও <a href="../policy/privacy.html" target="_blank">গোপনীয়তা নীতি</a> মেনে নিচ্ছি</span></label>
        <button class="btn primary" type="submit">অ্যাকাউন্ট খুলুন</button>
        <p class="switch">আগে থেকে অ্যাকাউন্ট আছে? <a href="#" id="toLogin">লগইন</a></p>
      </form>
      <p id="authErr" class="err"></p>
      <p class="muted tiny">পাসওয়ার্ড ভুলে গেলে সাপোর্টে যোগাযোগ করুন।</p>
      <p translate="no"><a href="#" id="authLang" class="tiny" style="color:var(--muted)">🌐 English / বাংলা</a></p>
    </div>
  </section>

  <!-- মূল অ্যাপ -->
  <section id="main" class="hidden">
    <div id="screen" class="screen"></div>
    <nav class="tabbar">
      <a href="#home" data-t="home" aria-label="হোম"><svg viewBox="0 0 32 32"><path d="M12.5 26.5 5.6 19.4a6.6 6.6 0 0 1 9.3-9.4l.6.6.6-.6a6.6 6.6 0 0 1 9.3 9.4" /><path d="M20 28.2l-5-5a3.6 3.6 0 0 1 5-5.1 3.6 3.6 0 0 1 5 5.1z" class="fill" /></svg></a>
      <a href="#feed" data-t="feed" aria-label="রিলস"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11.5" /><path d="M13.3 11.2v9.6l7.6-4.8z" class="fill" /></svg></a>
      <a href="#upload" data-t="upload" class="plus" aria-label="আপলোড"><i>＋</i></a>
      <a href="#texts" data-t="texts" aria-label="টেক্সট আর্নিং"><svg viewBox="0 0 32 32"><path d="M7 5.5h14l5 5v16a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 6 26.5V7A1.5 1.5 0 0 1 7.5 5.5z" /><path d="M11 13h10M11 17.5h10M11 22h6" /></svg></a>
      <a href="#me" data-t="me" aria-label="আমি"><svg viewBox="0 0 32 32"><path d="M16 4.5c6.4 0 10.5 4.6 10.5 10.6v11.4l-2.6-2-2.6 2-2.6-2-2.7 2-2.6-2-2.6 2-2.6-2-2.7 2V15.1C5.5 9.1 9.6 4.5 16 4.5z" /><circle cx="12.3" cy="14.5" r="1.5" class="fill" /><circle cx="19.7" cy="14.5" r="1.5" class="fill" /><path d="M13 18.6c1.6 1.6 4.4 1.6 6 0" /></svg><b id="unread" class="dot"></b></a>
    </nav>
  </section>

  <div id="sheet" class="sheet-wrap hidden"><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
  <div id="toast" class="toast"></div>

  <script src="../i18n.js?v=202611182216"></script>
  <script src="../config.js?v=202611182216"></script>
  <script type="module" src="app.js?v=202611182216"></script>
</body>
</html>
