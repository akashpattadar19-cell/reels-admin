<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Reels Enjoy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- লগইন / রেজিস্টার -->
  <section id="auth" class="auth hidden">
    <div class="auth-card">
      <div class="logo-big">▶</div>
      <h1>Reels Enjoy</h1>
      <p class="muted">ভিডিও দেখুন, বানান, আয় করুন</p>
      <form id="loginForm">
        <input id="liPhone" inputmode="numeric" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" autocomplete="username" required>
        <input id="liPass" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
        <button class="btn primary" type="submit">লগইন</button>
        <p class="switch">অ্যাকাউন্ট নেই? <a href="#" id="toReg">রেজিস্টার করুন</a></p>
      </form>
      <form id="regForm" class="hidden">
        <input id="rgName" placeholder="আপনার নাম" required>
        <input id="rgUser" placeholder="ইউজারনেম (ইংরেজি, যেমন rahim_01)" autocapitalize="off" required>
        <input id="rgPhone" inputmode="numeric" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" required>
        <input id="rgPass" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" autocomplete="new-password" required>
        <button class="btn primary" type="submit">অ্যাকাউন্ট খুলুন</button>
        <p class="switch">আগে থেকে অ্যাকাউন্ট আছে? <a href="#" id="toLogin">লগইন</a></p>
      </form>
      <p id="authErr" class="err"></p>
      <p class="muted tiny">পাসওয়ার্ড ভুলে গেলে সাপোর্টে যোগাযোগ করুন।</p>
    </div>
  </section>

  <!-- মূল অ্যাপ -->
  <section id="main" class="hidden">
    <div id="screen" class="screen"></div>
    <nav class="tabbar">
      <a href="#feed" data-t="feed"><i>🏠</i><span>হোম</span></a>
      <a href="#wallet" data-t="wallet"><i>💰</i><span>ওয়ালেট</span></a>
      <a href="#upload" data-t="upload" class="plus"><i>＋</i></a>
      <a href="#inbox" data-t="inbox"><i>🔔</i><span>ইনবক্স</span><b id="unread" class="dot"></b></a>
      <a href="#me" data-t="me"><i>👤</i><span>আমি</span></a>
    </nav>
  </section>

  <div id="sheet" class="sheet-wrap hidden"><div class="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
  <div id="toast" class="toast"></div>

  <script src="../config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
